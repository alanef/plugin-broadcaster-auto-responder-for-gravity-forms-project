name: Release

on:
  push:
    tags:
      - 'v*.*.*'    # Matches v1.7.3
      - '*.*.*'      # Matches 1.7.3
      - 'v*.*'       # Matches v2.3
      - '*.*'        # Matches 2.3

permissions:
  contents: write

jobs:
  quality-checks:
    uses: ./.github/workflows/checks.yml

  release:
    needs: quality-checks
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6

    - name: Extract PHP version
      id: php_version
      run: |
        PHP_VERSION=$(grep -oP 'Requires PHP:\s*\K[\d.]+' broadcaster-auto-responder-for-gravity-forms/broadcaster-auto-responder-for-gravity-forms.php || echo "7.4")
        echo "version=$PHP_VERSION" >> $GITHUB_OUTPUT

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ steps.php_version.outputs.version }}
        tools: composer:v2, wp-cli
        coverage: none

    - name: Verify tag matches plugin version
      run: |
        TAG_VERSION=${GITHUB_REF#refs/tags/}
        TAG_VERSION=${TAG_VERSION#v}
        PLUGIN_VERSION=$(grep -oP 'Version:\s*\K[0-9a-zA-Z.-]+' broadcaster-auto-responder-for-gravity-forms/broadcaster-auto-responder-for-gravity-forms.php)

        echo "Tag version: $TAG_VERSION"
        echo "Plugin version: $PLUGIN_VERSION"

        if [ "$TAG_VERSION" != "$PLUGIN_VERSION" ]; then
          echo "Tag version does not match plugin version!"
          exit 1
        fi

    - name: Install dependencies
      run: |
        composer install --prefer-dist --no-progress --no-dev --optimize-autoloader

    - name: Install plugin runtime dependencies
      # The plugin's BroadcasterGF\* classes are autoloaded via the plugin's
      # own composer.json (classmap of includes/). Without running composer
      # install inside the plugin folder, vendor/autoload.php is never
      # generated and the dist zip ships without it — fatal on real WP
      # installs (broke v1.0.0 and v1.0.1 in production).
      run: composer install --prefer-dist --no-progress --no-dev --optimize-autoloader --working-dir=broadcaster-auto-responder-for-gravity-forms

    - name: Install WP-CLI dist-archive command
      run: wp package install wp-cli/dist-archive-command:v3.1.0

    - name: Build plugin
      run: |
        # Use WP-CLI to build the plugin archive
        wp dist-archive ./broadcaster-auto-responder-for-gravity-forms ./broadcaster-auto-responder-for-gravity-forms.zip
        
        # Create dist directory for consistency with build script
        mkdir -p dist
        mv broadcaster-auto-responder-for-gravity-forms.zip dist/
        
        # Also rename with version for better release management
        PLUGIN_VERSION=$(grep -oP 'Version:\s*\K[0-9a-zA-Z.-]+' broadcaster-auto-responder-for-gravity-forms/broadcaster-auto-responder-for-gravity-forms.php)
        cp dist/broadcaster-auto-responder-for-gravity-forms.zip "dist/broadcaster-auto-responder-for-gravity-forms-${PLUGIN_VERSION}.zip"
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: dist/*.zip
        body: |
          Release of Broadcaster Auto Responder for Gravity Forms ${{ github.ref_name }}

          ## Installation
          1. Download `broadcaster-auto-responder-for-gravity-forms.zip` from the assets below.
          2. In WordPress admin, go to Plugins → Add New → Upload Plugin.
          3. Choose the downloaded zip file and click Install Now.
          4. Activate the plugin.
          5. Configure the plugin under Forms → Settings → Broadcaster (a paid Broadcaster account is required).

          ## Changelog
          See [readme.txt](broadcaster-auto-responder-for-gravity-forms/readme.txt) for the detailed changelog.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}