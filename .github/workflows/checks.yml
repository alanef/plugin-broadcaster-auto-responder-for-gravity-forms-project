name: Quality Checks

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_call:

jobs:
  unit-tests:
    name: Unit tests · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    # 8.4 / 8.5 are signal-only: the suite is pinned to PHPUnit 9.x (the only
    # line that still runs on the plugin's PHP 7.4 floor, and EOL since Feb
    # 2025), and tests/phpunit-unit.xml.dist uses PHPUnit-9-only schema, so the
    # runner can be 8.5 but PHPUnit can't reliably execute there. These legs
    # don't gate the build until the PHPUnit stack is modernised.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3']
        include:
          - php: '8.4'
            experimental: true
          - php: '8.5'
            experimental: true

    steps:
    - uses: actions/checkout@v6

    - name: Setup PHP ${{ matrix.php }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        tools: composer:v2
        coverage: none

    # composer.json pins platform.php to 7.4, so dependency resolution installs
    # the PHPUnit 9.6 / WPCS set identically on every leg regardless of runner.
    - name: Install dev dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run unit test suite
      run: composer run-script test:unit

  quality-checks:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6

    - name: Extract PHP version
      id: php_version
      run: |
        PHP_VERSION=$(grep -oP 'Requires PHP:\s*\K[\d.]+' broadcaster-auto-responder-for-gravity-forms/broadcaster-auto-responder-for-gravity-forms.php || echo "7.4")
        echo "version=$PHP_VERSION" >> $GITHUB_OUTPUT

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ steps.php_version.outputs.version }}
        tools: composer:v2, wp-cli
        coverage: none

    - name: Validate composer.json
      run: composer validate --no-check-all --no-check-publish

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run PHPCS WordPress Coding Standards
      run: composer run-script lint

    - name: Run Security Checks
      run: |
        if composer show --installed | grep -q "phpcs-variable-analysis"; then
          composer run-script phpcs-security
        else
          echo "Security checks not configured, skipping..."
        fi

    - name: Check PHP Compatibility
      run: |
        if composer show --installed | grep -q "phpcompatibility"; then
          composer run-script phpcompat
        else
          ./vendor/bin/phpcs --standard=PHPCompatibilityWP --runtime-set testVersion 7.4- --extensions=php broadcaster-auto-responder-for-gravity-forms/
        fi

    - name: Check version consistency
      run: |
        PLUGIN_VERSION=$(sed -n 's/ \* Version:\s*\(.*\)/\1/p' broadcaster-auto-responder-for-gravity-forms/broadcaster-auto-responder-for-gravity-forms.php | xargs)
        CONSTANT_VERSION=$(sed -n "s/.*BROADCASTERGF_VERSION.*'\(.*\)'.*/\1/p" broadcaster-auto-responder-for-gravity-forms/broadcaster-auto-responder-for-gravity-forms.php | xargs)

        echo "Plugin header version: $PLUGIN_VERSION"
        echo "Version constant: $CONSTANT_VERSION"

        if [ "$PLUGIN_VERSION" != "$CONSTANT_VERSION" ]; then
          echo "Version mismatch detected!"
          exit 1
        fi

    - name: Install WP-CLI dist-archive command
      run: wp package install wp-cli/dist-archive-command:v3.1.0

    - name: Build plugin
      run: |
        composer run-script build
        mkdir tmp-build
        unzip dist/broadcaster-auto-responder-for-gravity-forms.zip -d tmp-build

    - name: WordPress Plugin Check
      uses: wordpress/plugin-check-action@v1
      with:
        build-dir: 'tmp-build/broadcaster-auto-responder-for-gravity-forms'